<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Planilha Real</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f5f6fa;margin:0;padding:10px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:4px;text-align:center;font-size:12px}
input,select{width:100%;box-sizing:border-box}
button{cursor:pointer}
tfoot{font-weight:bold;background:#eee}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

<h3>Controle Mensal</h3>

<select id="mesSelect"></select>
<button onclick="novoAluno()">+ Aluno</button>

<table>
<thead id="cabecalho"></thead>
<tbody id="corpo"></tbody>
<tfoot>
<tr>
<td colspan="40">Total do mês: R$ <span id="totalMes">0.00</span></td>
</tr>
</tfoot>
</table>

<script>
// 🔥 CONFIG FIREBASE (AJUSTE AQUI)
const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "SEU_DOMINIO",
  databaseURL: "SUA_URL",
  projectId: "SEU_ID",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔧 VARIÁVEIS
const corpo = document.getElementById("corpo");
const cabecalho = document.getElementById("cabecalho");
const totalMesSpan = document.getElementById("totalMes");
const mesSelect = document.getElementById("mesSelect");

const colaborador = "principal";
let mesAtual = "";

// 🔁 MESES
const meses = [
 "2026-01","2026-02","2026-03","2026-04","2026-05","2026-06",
 "2026-07","2026-08","2026-09","2026-10","2026-11","2026-12"
];

// 🔹 INICIAR
meses.forEach(m=>{
  const o=document.createElement("option");
  o.value=m; o.text=m;
  mesSelect.appendChild(o);
});
mesAtual=meses[0];
mesSelect.value=mesAtual;
mesSelect.onchange=()=>{mesAtual=mesSelect.value;carregarDados()};

montarCabecalho();
carregarDados();

// 🔷 CABEÇALHO
function montarCabecalho(){
  cabecalho.innerHTML="<tr><th>Nome</th><th>Tipo</th><th>Base</th><th>Extra</th>";
  for(let i=1;i<=31;i++) cabecalho.innerHTML+=`<th>${i}</th>`;
  cabecalho.innerHTML+="<th>Total</th><th>X</th></tr>";
}

// 🔷 CARREGAR DADOS + COPIAR JANEIRO
function carregarDados(){
  corpo.innerHTML="";
  const refMes=db.ref(`colaboradores/${colaborador}/ciclos/${mesAtual}/alunos`);
  const refJan=db.ref(`colaboradores/${colaborador}/ciclos/2026-01/alunos`);

  refMes.once("value").then(snap=>{
    if(snap.exists()){
      Object.values(snap.val()).forEach(a=>linhaAluno(a,true));
      calcularTotal();
    }else{
      refJan.once("value").then(jan=>{
        if(!jan.exists()) return;
        const base=Object.values(jan.val()).map(a=>({
          nome:a.nome,
          tipo:a.tipo,
          valorBase:a.valorBase,
          valorExtra:null, // 🔥 NÃO COPIA
          dias:[]
        }));
        refMes.set(base).then(()=>{
          base.forEach(a=>linhaAluno(a,true));
          calcularTotal();
        });
      });
    }
  });
}

// 🔷 NOVO ALUNO
function novoAluno(){
  linhaAluno({
    nome:"",
    tipo:"Mensal",
    valorBase:"",
    valorExtra:null,
    dias:[]
  });
}

// 🔷 LINHA
function linhaAluno(aluno,salvar=false){
  const tr=document.createElement("tr");

  const nome=iInput(aluno.nome,v=>aluno.nome=v);
  const tipo=iSelect(["Mensal","Gympass","TotalPass"],aluno.tipo,v=>aluno.tipo=v);
  const base=iInput(aluno.valorBase,v=>aluno.valorBase=v);
  const extra=iInput(aluno.valorExtra ?? "",v=>aluno.valorExtra=v===""?null:Number(v));

  tr.append(nome,tipo,base,extra);

  const checks=[];
  for(let i=1;i<=31;i++){
    const c=document.createElement("input");
    c.type="checkbox";
    c.checked=aluno.dias?.includes(i);
    c.onchange=()=>{
      aluno.dias=aluno.dias||[];
      c.checked?aluno.dias.push(i):aluno.dias=aluno.dias.filter(d=>d!==i);
      salvarDados();
    };
    const td=document.createElement("td");
    td.appendChild(c);
    tr.appendChild(td);
    checks.push(c);
  }

  const totalTd=document.createElement("td");
  const del=document.createElement("button");
  del.textContent="X";
  del.onclick=()=>{tr.remove();salvarDados();};

  tr.append(totalTd,del);
  corpo.appendChild(tr);

  function atualizar(){
    let total=Number(aluno.valorBase||0)*((aluno.dias||[]).length||1);
    if(aluno.valorExtra!==null) total+=Number(aluno.valorExtra);
    totalTd.textContent=total.toFixed(2);
    calcularTotal();
    salvarDados();
  }

  [nome,base,extra,tipo].forEach(i=>i.oninput=atualizar);
  atualizar();
}

// 🔷 INPUT
function iInput(valor,fn){
  const i=document.createElement("input");
  i.value=valor;
  i.oninput=e=>fn(e.target.value);
  return i;
}
function iSelect(op,valor,fn){
  const s=document.createElement("select");
  op.forEach(o=>{
    const x=document.createElement("option");
    x.value=o;x.text=o;
    if(o===valor)x.selected=true;
    s.appendChild(x);
  });
  s.onchange=e=>fn(e.target.value);
  return s;
}

// 🔷 SALVAR
function salvarDados(){
  const dados=[];
  [...corpo.children].forEach(tr=>{
    const tds=tr.querySelectorAll("td,input,select");
    if(!tds.length) return;
    dados.push({
      nome:tds[0].value,
      tipo:tds[1].value,
      valorBase:tds[2].value,
      valorExtra:tds[3].value===""?null:Number(tds[3].value),
      dias:[...tr.querySelectorAll("input[type=checkbox]")]
        .map((c,i)=>c.checked?i+1:null).filter(Boolean)
    });
  });
  db.ref(`colaboradores/${colaborador}/ciclos/${mesAtual}/alunos`).set(dados);
}

// 🔷 TOTAL
function calcularTotal(){
  let t=0;
  corpo.querySelectorAll("tr").forEach(r=>{
    const v=r.lastChild.previousSibling.textContent;
    t+=Number(v||0);
  });
  totalMesSpan.textContent=t.toFixed(2);
}
</script>

</body>
</html>
