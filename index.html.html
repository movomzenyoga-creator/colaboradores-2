<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilha Realtime</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(120deg,#f3e8ff,#e0f7ff);
  padding: 15px;
}
h1 { text-align:center; color:#4b0082 }
.controls {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
table {
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  background:#fff;
}
th,td {
  border:1px solid #d6bcfa;
  padding:4px;
  text-align:center;
  font-size:13px;
}
th {
  background:#6b21a8;
  color:#fff;
}
input,select {
  border:1px solid #a78bfa;
  border-radius:4px;
  padding:4px;
}
button {
  padding:6px 10px;
  background:#06b6d4;
  color:#fff;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
button.danger { background:#dc2626 }
.total { font-weight:bold }
.resumo {
  margin-top:10px;
  background:#fff;
  padding:10px;
  border-radius:8px;
}
.wrapper {
  overflow-x:auto;
}
</style>
</head>

<body>

<h1>📋 Planilha Realtime</h1>

<div class="controls">
  <label>Colaborador:</label>
  <select id="colaboradorSelect"></select>
  <button onclick="novoColaborador()">➕</button>
  <button class="danger" onclick="removerColaborador()">🗑️</button>

  <label>Mês:</label>
  <input type="month" id="mesSelect">
</div>

<div class="wrapper">
<table>
<thead><tr id="cabecalho"></tr></thead>
<tbody id="corpoTabela"></tbody>
</table>
</div>

<button onclick="adicionarAluno()">➕ Aluno</button>
<button onclick="limparDias()">🧹 Limpar dias</button>

<div class="resumo">
  <p id="total"></p>
  <p id="aulas"></p>
  <p id="mediaAula"></p>
  <p id="media"></p>
</div>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyD9Er27RZlKcFVVwrnWfo2xvWkPUla9JRs",
  databaseURL: "https://colaboradores-5a2a2-default-rtdb.firebaseio.com"
});
const db = firebase.database();

/* ESTADO */
let colaboradorAtual=null;
let mesAtual=new Date().toISOString().slice(0,7);
let debounce=null;
mesSelect.value=mesAtual;

/* DIAS DO MÊS */
function diasNoMes(ano,mes){
  return new Date(ano,mes,0).getDate();
}

/* CABEÇALHO DINÂMICO */
function montarCabecalho(){
  const [ano,mes]=mesAtual.split("-");
  const dias=diasNoMes(ano,mes);
  cabecalho.innerHTML=`
    <th>Aluno</th>
    <th>Tipo</th>
    <th>Base</th>
    <th>Extra</th>
    ${Array.from({length:dias},(_,i)=>`<th>${i+1}</th>`).join("")}
    <th>Total</th>
    <th></th>
  `;
}

/* COLABORADORES */
function carregarColaboradores(){
  db.ref("colaboradores").once("value").then(snap=>{
    colaboradorSelect.innerHTML="";
    Object.keys(snap.val()||{}).forEach(n=>{
      let o=document.createElement("option");
      o.value=o.textContent=n;
      colaboradorSelect.appendChild(o);
    });
    colaboradorAtual=colaboradorSelect.value;
    carregarDados();
    calcularMedia();
  });
}

colaboradorSelect.onchange=()=>{
  colaboradorAtual=colaboradorSelect.value;
  carregarDados();
  calcularMedia();
};

mesSelect.onchange=()=>{
  mesAtual=mesSelect.value;
  carregarDados();
};

/* CARREGAR */
function carregarDados(){
  corpoTabela.innerHTML="";
  if(!colaboradorAtual) return;
  montarCabecalho();
  db.ref(`colaboradores/${colaboradorAtual}/ciclos/${mesAtual}/alunos`)
    .once("value").then(snap=>{
      Object.values(snap.val()||{}).forEach(a=>adicionarAluno(a,true));
      calcularTotal();
    });
}

/* ALUNO */
function adicionarAluno(data={},remoto=false){
  const [ano,mes]=mesAtual.split("-");
  const dias=diasNoMes(ano,mes);
  let tr=document.createElement("tr");
  tr.innerHTML=`
    <td><input class="nome"></td>
    <td>
      <select class="tipo">
        <option>Mensal</option>
        <option>Gympass</option>
        <option>TotalPass</option>
      </select>
    </td>
    <td><input type="number" class="base"></td>
    <td><input type="number" class="extra"></td>
    ${"<td><input type='checkbox'></td>".repeat(dias)}
    <td class="total">0</td>
    <td><button onclick="this.closest('tr').remove();salvar()">❌</button></td>
  `;
  corpoTabela.appendChild(tr);

  tr.querySelector(".nome").value=data.nome||"";
  tr.querySelector(".tipo").value=data.tipo||"Mensal";
  tr.querySelector(".base").value=data.valorBase||"";
  tr.querySelector(".extra").value=data.valorExtra||"";
  (data.dias||[]).forEach((d,i)=>tr.querySelectorAll("input[type=checkbox]")[i]&&(tr.querySelectorAll("input[type=checkbox]")[i].checked=d));

  tr.querySelectorAll("input,select").forEach(i=>{
    i.onchange=()=>{ salvar(); calcularTotal(); };
  });

  if(!remoto) salvar();
}

/* LIMPAR */
function limparDias(){
  corpoTabela.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);
  salvar(); calcularTotal();
}

/* SALVAR COM DEBOUNCE */
function salvar(){
  clearTimeout(debounce);
  debounce=setTimeout(()=>{
    let alunos=[];
    corpoTabela.querySelectorAll("tr").forEach(tr=>{
      alunos.push({
        nome:tr.querySelector(".nome").value,
        tipo:tr.querySelector(".tipo").value,
        valorBase:tr.querySelector(".base").value,
        valorExtra:tr.querySelector(".extra").value,
        dias:[...tr.querySelectorAll("input[type=checkbox]")].map(c=>c.checked)
      });
    });
    db.ref(`colaboradores/${colaboradorAtual}/ciclos/${mesAtual}/alunos`).set(alunos);
  },500);
}

/* TOTAL + RESUMO */
function calcularTotal(){
  let totalMes=0,aulas=0;
  corpoTabela.querySelectorAll("tr").forEach(tr=>{
    let b=+tr.querySelector(".base").value||0;
    let e=+tr.querySelector(".extra").value||0;
    let d=tr.querySelectorAll("input[type=checkbox]:checked").length;
    aulas+=d;
    let t=(b*d)+e;
    tr.querySelector(".total").innerText=t.toFixed(2);
    totalMes+=t;
  });
  total.innerText="💰 Total do mês: R$ "+totalMes.toFixed(2);
  aulasEl.innerText="📅 Total de aulas: "+aulas;
  mediaAula.innerText="📊 Média por aula: R$ "+(aulas?totalMes/aulas:0).toFixed(2);
}

/* MÉDIA SALARIAL */
function calcularMedia(){
  db.ref(`colaboradores/${colaboradorAtual}/ciclos`).once("value").then(snap=>{
    let soma=0,cont=0;
    snap.forEach(m=>{
      Object.values(m.val().alunos||{}).forEach(a=>{
        let d=(a.dias||[]).filter(Boolean).length;
        soma+=(+a.valorBase||0)*d+(+a.valorExtra||0);
      });
      cont++;
    });
    media.innerText="📈 Média salarial: R$ "+(cont?soma/cont:0).toFixed(2);
  });
}

/* CRUD */
function novoColaborador(){
  let n=prompt("Nome:");
  if(n) db.ref("colaboradores/"+n).set({}),carregarColaboradores();
}
function removerColaborador(){
  if(confirm("Remover colaborador?"))
    db.ref("colaboradores/"+colaboradorAtual).remove(),carregarColaboradores();
}

window.onload=carregarColaboradores;
</script>
</body>
</html>
